server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Páginas, CSS, JS e imagens do site
    location / {
        try_files $uri $uri/ =404;
    }

    # Tudo que chega em /api/ é repassado ao container do backend.
    # A barra no final de proxy_pass remove o prefixo /api,
    # então /api/noticias vira http://backend:8080/noticias
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
